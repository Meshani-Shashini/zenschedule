{Object.keys(REM_DEF).map((g) => <label key={g} className="flex items-center justify-between gap-3 text-sm">{g === "Official" ? "Work / Official" : g}<select value={remDef[g]} onChange={(e) => setRemDef((r) => ({ ...r, [g]: +e.target.value }))} className="rounded-xl px-2 py-2 text-sm outline-none" style={{ background: C.card, color: C.t1 }}>{REM_OPTS.map(([v, l]) => <option key={v} value={v}>{l}</option>)}</select></label>)}
<label className="flex items-center justify-between gap-3 text-sm">Read reminders aloud automatically<input type="checkbox" checked={autoRead} onChange={(e) => setAutoRead(e.target.checked)} className="w-5 h-5" /></label></div></Sheet>}
{micHelp && <Sheet title="Microphone is blocked" onClose={() => setMicHelp(false)}><p className="text-sm">ZenSchedule needs permission to use your microphone for Voice Add. To turn it on:</p><ol className="text-sm list-decimal pl-5 space-y-1" style={{ color: C.t2 }}><li>Tap the lock or settings icon next to the web address.</li><li>Open <b>Site settings</b>, then <b>Microphone</b>, and choose <b>Allow</b>.</li><li>Reload this page and tap Voice Add again.</li></ol><p className="text-xs" style={{ color: C.t2 }}>On iPhone: Settings → Safari → Microphone → Allow, and make sure Dictation is on (Settings → General → Keyboard).</p><button onClick={() => { setMicHelp(false); startVoice(); }} className="w-full rounded-xl py-3 text-sm font-semibold" style={{ background: C.blue, color: "#fff" }}>Try again</button></Sheet>}
{vp && <Sheet title="Confirm voice task" onClose={() => setVp(null)}><p className="text-xs" style={{ color: C.t2 }}>Heard: “{vp.heard}”</p><Card className="space-y-1.5 text-sm">{[["Title", vp.title], ["Description", vp.notes || "—"], ["Category", CODE_NAMES[vp.code]], ["Date", vp.date || mDate], ["Time", vp.time != null ? fmt(vp.time) : "—"], ...(vp.amt != null ? [["Amount", vp.cur + " " + vp.amt.toLocaleString()]] : [])].map(([k, v]) => <div key={k} className="flex justify-between gap-4"><span style={{ color: C.t2 }}>{k}</span><span className="text-right">{v}</span></div>)}</Card>{vp.amt != null && vp.cur !== baseCur && <input type="number" min="0" inputMode="decimal" value={mRate} onChange={(e) => setMRate(e.target.value)} placeholder={"Exchange rate: 1 " + vp.cur + " = ? " + baseCur} className="w-full rounded-xl px-3 py-2.5 text-sm outline-none" style={{ background: C.card, color: C.t1 }} />}<div className="grid grid-cols-2 gap-2"><button onClick={() => setVp(null)} className="rounded-xl py-3 text-sm font-semibold" style={{ background: C.card, color: C.t1 }}>Edit</button><button onClick={() => { setVp(null); confirmManual(); }} className="rounded-xl py-3 text-sm font-semibold" style={{ background: C.blue, color: "#fff" }}>Save task</button></div></Sheet>}
{alarm && <div className="absolute left-3 right-3 z-40 rounded-2xl p-3 border space-y-2" style={{ top: "calc(var(--top) + 8px)", background: C.card, borderColor: C.red, boxShadow: "0 6px 20px rgba(0,0,0,.35)" }}><div className="flex items-center gap-2"><span className="zs-ring"><Bell size={20} color={C.red} /></span><div className="flex-1 min-w-0"><p className="text-[10px] font-semibold" style={{ color: C.red }}>{alarm.kind.toUpperCase()} · {fmt(alarm.at)}</p><p className="text-sm truncate">{alarm.title}</p></div></div><div className="flex gap-2"><button onClick={() => { setSnz((x) => ({ ...x, [alarm.key]: nowMin + 15 })); flash("Snoozed until " + fmt(nowMin + 15)); }} className="flex-1 rounded-xl py-2 text-xs font-semibold" style={{ background: C.blue, color: "#fff" }}>Snooze 15 min</button><button onClick={() => speak(readText(alarm))} className="flex-1 rounded-xl py-2 text-xs font-semibold" style={{ background: C.line, color: C.t1 }} aria-label="Read reminder aloud">🔊 Read aloud</button><button onClick={() => setDis((x) => ({ ...x, [alarm.key]: 1 }))} className="flex-1 rounded-xl py-2 text-xs font-semibold" style={{ background: C.line, color: C.t1 }}>Dismiss</button></div></div>}
{toast && <div className="absolute left-4 right-4 z-40 rounded-xl px-3 py-2 text-sm text-center" style={{ background: C.em, color: "#fff", bottom: "calc(var(--nh) + var(--sab) + " + (undo ? 68 : 12) + "px)" }}>{toast}</div>}
{undo && <div key={undo.k} className="absolute left-4 right-4 z-40 rounded-xl overflow-hidden" style={{ background: "#1F2937", color: "#fff", bottom: "calc(var(--nh) + var(--sab) + 12px)" }}><div className="flex items-center gap-3 px-3 py-2.5"><span className="flex-1 min-w-0 truncate text-sm">“{undo.title}” completed</span><button onClick={undoDone} className="text-sm font-bold px-2 py-1" style={{ color: "#7CC0FF" }}>UNDO</button></div><div className="h-1" style={{ background: "#7CC0FF", animation: "zsShrink 5s linear forwards" }} /></div>}
</div>
</div>
);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
