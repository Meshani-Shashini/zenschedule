<div className="space-y-2 pt-4 border-t" style={{ borderColor: C.line }}><p className="text-xs font-bold uppercase tracking-wide" style={{ color: C.blue }}>Scheduled ({sortedN.length})</p>{sortedN.length === 0 && <Empty>Nothing scheduled yet.</Empty>}{sortedN.map((n) => { const past = new Date(n.date + "T00:00:00").getTime() + n.t * 60000 <= Date.now(); return <div key={n.id} className="flex items-center gap-2 border-t pt-2" style={{ borderColor: C.line }}><div className="flex-1 min-w-0"><p className="text-sm truncate">{n.title}</p><p className="text-xs tabular-nums" style={{ color: C.t2 }}>{isoToFmt(n.date, "DMY")} {fmt(n.t)} · {past ? "Sent" : "Scheduled"}</p></div><button onClick={() => setNotifs((x) => x.filter((y) => y.id !== n.id))} aria-label={"Delete " + n.title} className="text-sm px-2" style={{ color: C.red }}>🗑</button></div>; })}</div>
<div className="space-y-2 pt-4 border-t" style={{ borderColor: C.line }}><p className="text-xs font-bold uppercase tracking-wide" style={{ color: C.blue }}>Command line</p><div className="rounded-xl p-3 font-mono text-xs space-y-2 max-h-48 overflow-y-auto" style={{ background: "#0B0F14", color: "#9AE6B4" }} role="log" aria-live="polite">{cmdLog.length === 0 && <p style={{ color: "#6B7380" }}>Type help to see commands.</p>}{cmdLog.map((l, i) => <div key={i}><p style={{ color: "#E5E7EB" }}>{"> "}{l.c}</p><pre className="whitespace-pre-wrap" style={{ color: l.ok ? "#9AE6B4" : "#FCA5A5" }}>{l.o}</pre></div>)}</div><div className="flex gap-2 items-center rounded-xl px-3 py-2 font-mono text-sm" style={{ background: "#0B0F14", color: "#9AE6B4" }}><span>{">"}</span><input value={cmdIn} onChange={(e) => setCmdIn(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") runCmd(cmdIn); }} placeholder='notify "Pay rent" 25/10/2026 09:00' aria-label="Command input" autoCapitalize="off" autoCorrect="off" spellCheck={false} className="flex-1 min-w-0 bg-transparent outline-none" style={{ color: "#E5E7EB" }} /><button onClick={() => runCmd(cmdIn)} aria-label="Run command" className="text-xs font-bold px-2 py-1 rounded-lg" style={{ background: "#1F2937", color: "#9AE6B4" }}>RUN</button></div></div></Sheet>}
{priSheet && (() => { const it = [...extras, ...backlog].find((x) => x.id === priSheet); if (!it) return null; const cur = it.pri || "Medium"; return <Sheet title="Set priority" onClose={() => setPriSheet(null)}><p className="text-sm truncate">{it.title}</p><div className="grid grid-cols-3 gap-2">{["High", "Medium", "Low"].map((p) => <button key={p} onClick={() => setPri(it.id, p)} aria-pressed={cur === p} className="rounded-xl py-3 text-sm font-bold" style={{ background: cur === p ? PRI_COL[p] : PRI_BG[p], color: cur === p ? (p === "Medium" && theme !== "light" ? "#1F1300" : "#fff") : PRI_COL[p] }}>{p}{cur === p ? " ✓" : ""}</button>)}</div><p className="text-xs" style={{ color: C.t2 }}>Higher priority tasks appear first: High, then Medium, then Low.</p></Sheet>; })()}
{navO && <div className="absolute inset-0 z-[70] flex" role="dialog" aria-label="Navigation menu"><div className="w-72 max-w-[80%] h-full flex flex-col p-4 gap-0.5 overflow-y-auto" style={{ background: C.bg, boxShadow: "4px 0 24px rgba(0,0,0,.4)" }}><p className="text-lg font-bold mb-1">ZenSchedule</p>{[["Overview", [["dash", "Dashboard", "🏠"]]], ["Plan", [["agenda", "Agenda", "📅"], ["health", "Health", "💊"], ["areas", "Areas", "🗂"], ["cli", "Command", "⌨️"]]], ["Insights", [["charts", "Charts / Analytics", "📊"], ["reports", "Reports", "📄"]]], ["System", [["settings", "Settings", "⚙️"]]]].map(([g, items]) => <div key={g}><p className="text-[10px] font-bold uppercase tracking-wide mt-3 mb-1" style={{ color: C.t3 }}>{g}</p>{items.map(([k, l, ic]) => <button key={k} onClick={() => { setTab(k); setNavO(false); }} aria-current={tab === k ? "page" : undefined} className="w-full flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold text-left" style={{ background: tab === k ? "#0084FF22" : "transparent", color: tab === k ? C.blue : C.t1 }}><span aria-hidden>{ic}</span>{l}</button>)}</div>)}</div><button className="flex-1" aria-label="Close menu" onClick={() => setNavO(false)} style={{ background: "rgba(0,0,0,.5)" }} /></div>}
{rcView && <Sheet title="Receipt" onClose={() => setRcView("")}><img src={rcView} alt="Receipt" className="w-full rounded-xl" /></Sheet>}
{hgO && <Sheet title="Habits & Savings Goals" onClose={() => setHgO(false)}>
<p className="text-sm font-semibold">Habit streaks</p>
{habits.map((h) => { const dn = h.log.includes(todayNow); return <div key={h.id} className="flex items-center gap-2"><div className="flex-1 min-w-0"><p className="text-sm truncate">{h.name}</p><p className="text-xs" style={{ color: C.am }}>🔥 {streakOf(h.log)} day streak</p></div><button onClick={() => toggleHabit(h.id)} aria-pressed={dn} className="rounded-xl px-3 py-2 text-sm font-semibold shrink-0" style={{ background: dn ? C.em : C.card, color: dn ? "#fff" : C.t1 }}>{dn ? "Done ✓" : "Mark done"}</button><button onClick={() => setHabits((x) => x.filter((y) => y.id !== h.id))} aria-label={"Remove " + h.name} className="text-xs px-1" style={{ color: C.t3 }}>✕</button></div>; })}
<div className="flex gap-2"><input value={hName} maxLength={30} onChange={(e) => setHName(e.target.value)} placeholder="New habit (e.g. Read 20 min)" className="flex-1 min-w-0 rounded-xl px-3 py-2 text-sm outline-none" style={{ background: C.card, color: C.t1 }} /><button onClick={addHabit} className="rounded-xl px-3 py-2 text-sm font-semibold shrink-0" style={{ background: C.blue, color: "#fff" }}>Add</button></div>
<p className="text-sm font-semibold pt-2">Savings goals ({baseCur})</p><p className="text-xs" style={{ color: C.t2 }}>Savings above a goal's target move to your next active goal. Anything left over becomes Unallocated Surplus and fills new goals automatically.</p>
{goals.map((g) => { const pc = Math.min(100, Math.round((g.saved / g.target) * 100)); return <div key={g.id} className="space-y-1.5"><div className="flex justify-between text-sm gap-2"><span className="truncate">{g.name}</span><span className="tabular-nums text-xs shrink-0">{fm(g.saved)} / {fm(g.target)} · {pc}%</span></div><Bar pct={pc} color={pc >= 100 ? C.em : C.blue} /><div className="flex gap-2"><input type="number" min="0" inputMode="decimal" value={gAdd[g.id] || ""} onChange={(e) => setGAdd({ ...gAdd, [g.id]: e.target.value })} placeholder="Add savings" className="flex-1 min-w-0 rounded-xl px-3 py-2 text-sm outline-none" style={{ background: C.card, color: C.t1 }} /><button onClick={() => allocGoal(g.id)} className="rounded-xl px-3 py-2 text-sm font-semibold shrink-0" style={{ background: C.blue, color: "#fff" }}>+ Add</button><button onClick={() => { setSurplus((x) => x + g.saved); setGoals((x) => x.filter((y) => y.id !== g.id)); }} aria-label={"Remove " + g.name} className="text-xs px-1" style={{ color: C.t3 }}>✕</button></div></div>; })}
<p className="text-sm font-semibold tabular-nums" style={{ color: surplus > 0 ? C.em : C.t2 }}>Unallocated Surplus: {baseCur} {fm(surplus)}</p>
<div className="flex gap-2"><input value={gForm.name} maxLength={30} onChange={(e) => setGForm({ ...gForm, name: e.target.value })} placeholder="Goal (e.g. Buy Laptop)" className="flex-1 min-w-0 rounded-xl px-3 py-2 text-sm outline-none" style={{ background: C.card, color: C.t1 }} /><input type="number" min="0" inputMode="decimal" value={gForm.target} onChange={(e) => setGForm({ ...gForm, target: e.target.value })} placeholder="Target" className="w-24 rounded-xl px-3 py-2 text-sm outline-none" style={{ background: C.card, color: C.t1 }} /><button onClick={addGoal} className="rounded-xl px-3 py-2 text-sm font-semibold shrink-0" style={{ background: C.blue, color: "#fff" }}>Add</button></div></Sheet>}
{micHelp && <Sheet title="Microphone is blocked" onClose={() => setMicHelp(false)}><p className="text-sm">ZenSchedule needs permission to use your microphone for Voice Add. To turn it on:</p><ol className="text-sm list-decimal pl-5 space-y-1" style={{ color: C.t2 }}><li>Tap the lock or settings icon next to the web address.</li><li>Open <b>Site settings</b>, then <b>Microphone</b>, and choose <b>Allow</b>.</li><li>Reload this page and tap Voice Add again.</li></ol><p className="text-xs" style={{ color: C.t2 }}>On iPhone: Settings → Safari → Microphone → Allow, and make sure Dictation is on (Settings → General → Keyboard).</p><button onClick={() => { setMicHelp(false); startVoice(); }} className="w-full rounded-xl py-3 text-sm font-semibold" style={{ background: C.blue, color: "#fff" }}>Try again</button></Sheet>}
{vp && <Sheet title="Confirm voice task" onClose={() => setVp(null)}><p className="text-xs" style={{ color: C.t2 }}>Heard: “{vp.heard}”</p><Card className="space-y-1.5 text-sm">{[["Title", vp.title], ["Description", vp.notes || "—"], ["Category", CODE_NAMES[vp.code]], ["Date", vp.date || mDate], ["Time", vp.time != null ? fmt(vp.time) : "—"], ...(vp.amt != null ? [["Amount", vp.cur + " " + vp.amt.toLocaleString()]] : [])].map(([k, v]) => <div key={k} className="flex justify-between gap-4"><span style={{ color: C.t2 }}>{k}</span><span className="text-right">{v}</span></div>)}</Card>{vp.amt != null && vp.cur !== baseCur && <input type="number" min="0" inputMode="decimal" value={mRate} onChange={(e) => setMRate(e.target.value)} placeholder={"Exchange rate: 1 " + vp.cur + " = ? " + baseCur} className="w-full rounded-xl px-3 py-2.5 text-sm outline-none" style={{ background: C.card, color: C.t1 }} />}<div className="grid grid-cols-2 gap-2"><button onClick={() => setVp(null)} className="rounded-xl py-3 text-sm font-semibold" style={{ background: C.card, color: C.t1 }}>Edit</button><button onClick={() => { setVp(null); confirmManual(); }} className="rounded-xl py-3 text-sm font-semibold" style={{ background: C.blue, color: "#fff" }}>Save task</button></div></Sheet>}
{alarm && <div className="absolute left-3 right-3 z-40 rounded-2xl p-3 border space-y-2" style={{ top: "calc(var(--top) + 8px)", background: C.card, borderColor: C.red, boxShadow: "0 6px 20px rgba(0,0,0,.35)" }}><div className="flex items-center gap-2"><span className="zs-ring"><Bell size={20} color={C.red} /></span><div className="flex-1 min-w-0"><p className="text-[10px] font-semibold" style={{ color: C.red }}>{alarm.kind.toUpperCase()} · {fmt(alarm.at)}</p><p className="text-sm truncate">{alarm.title}</p></div></div><div className="flex gap-2"><button onClick={() => { setSnz((x) => ({ ...x, [alarm.key]: nowMin + 15 })); flash("Snoozed until " + fmt(nowMin + 15)); }} className="flex-1 rounded-xl py-2 text-xs font-semibold" style={{ background: C.blue, color: "#fff" }}>Snooze 15 min</button><button onClick={() => speak(readText(alarm))} className="flex-1 rounded-xl py-2 text-xs font-semibold" style={{ background: C.line, color: C.t1 }} aria-label="Read reminder aloud">🔊 Read aloud</button><button onClick={() => setDis((x) => ({ ...x, [alarm.key]: 1 }))} className="flex-1 rounded-xl py-2 text-xs font-semibold" style={{ background: C.line, color: C.t1 }}>Dismiss</button></div></div>}
{toast && <div className="absolute left-4 right-4 z-40 rounded-xl px-3 py-2 text-sm text-center" style={{ background: C.em, color: "#fff", bottom: "calc(var(--nh) + var(--sab) + " + (undo ? 68 : 12) + "px)" }}>{toast}</div>}
{undo && <div key={undo.k} className="absolute left-4 right-4 z-40 rounded-xl overflow-hidden" style={{ background: "#1F2937", color: "#fff", bottom: "calc(var(--nh) + var(--sab) + 12px)" }}><div className="flex items-center gap-3 px-3 py-2.5"><span className="flex-1 min-w-0 truncate text-sm">“{undo.title}” completed</span><button onClick={undoDone} className="text-sm font-bold px-2 py-1" style={{ color: "#7CC0FF" }}>UNDO</button></div><div className="h-1" style={{ background: "#7CC0FF", animation: "zsShrink 5s linear forwards" }} /></div>}
</div>
</div>
);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
