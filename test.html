function parse(text, existing) {
const m = text.trim().match(/^=([A-Za-z]{2})\s*(.*)$/s);

const code = m[1].toUpperCase();

const n = existing.filter((x) => x.id.startsWith(code)).length + 1;
return { code, cat: CODES[code], title: parts[0] || "", date, time, pr, id: code + String(n).padStart(3, "0") };
}

if (type === "receipt") {

let amt = (tl.map((l) => l.match(/\d[\d,]*\.\d{2}/g)).filter(Boolean).pop() || []).pop();
if (!amt) amt = (text.match(/\d[\d,]*\.\d{2}/g) || []).sort((x, y) => parseFloat(y.replace(/,/g, "")) - parseFloat(x.replace(/,/g, "")))[0];

<div className="space-y-2 pb-2">
<div className="relative">
<span className="absolute left-3 top-1/2 -translate-y-1/2" style={{ color: C.t3 }}><Search size={16} /></span>
<input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search title or ID (e.g. PT001)" className="w-full rounded-xl pl-9 pr-3 py-2.5 text-sm outline-none border" style={{ background: C.card, borderColor: C.line, color: C.t1 }} />
</div>
{areaTiles.length > 0 && (
<div className="flex gap-2 overflow-x-auto">
<Chip on={!selArea} onClick={() => setArea(null)}>All {areaTiles.reduce((a, x) => a + x[1], 0)}</Chip>
{areaTiles.map(([c, n]) => <Chip key={c} on={selArea === c} onClick={() => setArea(selArea === c ? null : c)}>{c} {n}</Chip>)}
</div>
)}
<div className="flex gap-2 items-center">
<select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className="flex-1 min-w-0 rounded-xl px-3 py-2 text-xs outline-none" style={{ background: C.card, color: C.t1 }}>
<option value="time">Sort: Time / schedule</option>
<option value="priority">Sort: Priority (high to low)</option>
<option value="category">Sort: Category</option>
</select>
<div className="flex rounded-xl overflow-hidden" style={{ background: C.card }}>
{[[false, LayoutGrid], [true, List]].map(([v, I]) => <button key={String(v)} onClick={() => setCompact(v)} className="px-3 py-2" style={{ background: compact === v ? C.blue : "transparent", color: compact === v ? "#fff" : C.t2 }} aria-label={v ? "Compact view" : "Card view"}><I size={16} /></button>)}
</div>
<button onClick={() => setSecs(true)} className="rounded-xl px-3 py-2" style={{ background: C.card, color: C.blue }} aria-label="Show or hide sections"><Eye size={16} /></button>
</div>
</div>
);
const Areas = (
<div className="space-y-3">
<div className={compact ? "space-y-1" : "space-y-2"}>
<p className="text-xs" style={{ color: C.t2 }}>{selArea || "All areas"} · {areaList.length} item{areaList.length === 1 ? "" : "s"}</p>
{areaList.length ? areaList.map(areaRow) : <Empty>{q ? "No tasks match your search." : "Nothing here yet."}</Empty>}
</div>
{!off.Finance && (
<Card className="space-y-3">
<p className="text-sm font-semibold">Finance overview</p>
<div><div className="flex justify-between text-xs mb-1"><span style={{ color: C.t2 }}>Monthly budget</span><span>62,400 / 80,000</span></div><Bar pct={78} color={C.blue} /></div>
<div><div className="flex justify-between text-xs mb-1"><span style={{ color: C.t2 }}>Credit balance</span><span>48,000 / 150,000</span></div><Bar pct={32} color={C.am} /></div>
{TX.map(([n, a, inc]) => <div key={n} className="flex justify-between text-sm border-t pt-2" style={{ borderColor: C.line }}><span>{n}</span><span className="tabular-nums" style={{ color: inc ? C.em : C.red }}>{inc ? "+" : "−"}{a.toLocaleString()}</span></div>)}
</Card>
)}
</div>
);

return (
<div className={plat + (REAL ? "" : " min-h-screen flex flex-col items-center justify-center gap-3 p-4")} style={{ background: "#050608", color: C.t1, fontFamily: FONTS[plat] }}>
<style>{PCSS}</style>
{!REAL && <div className="flex rounded-full p-1 text-xs font-semibold" style={{ background: C.card }}>{[["ios", "iOS"], ["android", "Android"]].map(([p, l]) => <button key={p} onClick={() => setPlat(p)} className="rounded-full px-4 py-1.5" style={{ background: plat === p ? C.blue : "transparent", color: plat === p ? "#fff" : C.t2 }}>{l}</button>)}</div>}
<div className="zs relative overflow-hidden flex flex-col" style={rootStyle}>
<div className="shrink-0" style={topBar}>
{frame ? <StatusBar plat={plat} time={hh} /> : <div style={{ height: "var(--sb)" }} />}
<header className="flex items-center gap-2 px-4" style={{ height: "var(--hh)" }}>
<h1 style={{ fontSize: ios ? 22 : 20, fontWeight: ios ? 700 : 500, letterSpacing: ios ? "-0.02em" : 0 }}>ZenSchedule</h1>

<span className="text-[10px] font-semibold px-2 py-0.5 rounded-full" style={{ background: "#0084FF22", color: C.blue }}>ZenOx</span>
<span className="ml-auto flex items-center gap-1 text-[10px] font-semibold" style={{ color: C.am }}><WifiOff size={12} />OFFLINE</span>
<button onClick={() => setScan({ stage: "pick", mode: "auto" })} className="w-8 h-8 rounded-full flex items-center justify-center" style={{ background: C.card, color: C.blue }} aria-label="Scan document"><Camera size={18} /></button>
<button onClick={() => { const n = new Date(); setMDate(isoOf(n)); setMHH(p2(n.getHours())); setMMM(p2(n.getMinutes())); setMSched(true); setMMode("form"); setMTried(false); setManual(true); }} className="w-8 h-8 rounded-full flex items-center justify-center" style={{ background: C.blue }} aria-label="Quick add"><Plus size={18} color="#fff" /></button>
</header>
{(tab === "agenda" || tab === "health") && <div className="px-4">{dateBar}</div>}
{tab === "agenda" && <div className="px-4">{agendaChips}</div>}
{tab === "areas" && <div className="px-4 pt-1">{areaControls}</div>}
</div>
<main className="flex-1 min-h-0 overflow-y-auto px-4 pt-3" style={{ paddingBottom: "calc(var(--nh) + var(--sab) + 16px)" }}>{tab === "agenda" ? Agenda : tab === "cli" ? Cli : tab === "health" ? Health : Areas}</main>
<nav className="absolute bottom-0 left-0 right-0 flex items-start px-2" style={navBar}>
{navs.map(([k, l, I]) => { const on = tab === k; return (
<button key={k} onClick={() => setTab(k)} className="flex-1 flex flex-col items-center gap-0.5 pt-2 font-medium" style={{ color: on ? C.blue : C.t3, fontSize: ios ? 10 : 12 }}>
<span className="flex items-center justify-center" style={ios ? {} : { width: 56, height: 28, borderRadius: 14, background: on ? "#0084FF33" : "transparent", color: on ? C.t1 : C.t3 }}><I size={ios ? 24 : 22} /></span>{l}
</button>
); })}
</nav>
{frame && <span className="absolute left-1/2 -translate-x-1/2 rounded-full" style={{ zIndex: 26, bottom: ios ? 8 : 6, width: ios ? 134 : 108, height: ios ? 5 : 4, background: "#F3F5F7aa" }} />}

{cal && (() => {
const lead = (new Date(cal.y, cal.m, 1).getDay() + 6) % 7;
const n = new Date(cal.y, cal.m + 1, 0).getDate();
const iso = (d) => cal.y + "-" + String(cal.m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
const go = (k) => { const d = new Date(cal.y, cal.m + k, 1); setCal({ y: d.getFullYear(), m: d.getMonth() }); };
const sel = { background: C.card, color: C.t1 };
return (
<Sheet title="Select date" onClose={() => setCal(null)}>
<div className="flex items-center gap-2">
<button onClick={() => go(-1)} aria-label="Previous month" className="w-9 h-9 rounded-xl flex items-center justify-center" style={sel}><ChevronLeft size={16} /></button>
<select value={cal.m} onChange={(e) => setCal({ ...cal, m: +e.target.value })} className="flex-1 min-w-0 rounded-xl px-2 py-2 text-sm outline-none" style={sel}>{Array.from({ length: 12 }, (_, i) => <option key={i} value={i}>{new Date(2000, i, 1).toLocaleString("en-GB", { month: "long" })}</option>)}</select>
<select value={cal.y} onChange={(e) => setCal({ ...cal, y: +e.target.value })} className="rounded-xl px-2 py-2 text-sm outline-none" style={sel}>{Array.from({ length: 31 }, (_, i) => 2015 + i).map((y) => <option key={y}>{y}</option>)}</select>
<button onClick={() => go(1)} aria-label="Next month" className="w-9 h-9 rounded-xl flex items-center justify-center" style={sel}><ChevronRight size={16} /></button>
</div>
<div className="grid grid-cols-7 gap-1 text-center">
{DAYS.map((d) => <span key={d} className="text-[10px] uppercase" style={{ color: C.t3 }}>{d}</span>)}
{Array.from({ length: lead }, (_, i) => <span key={"b" + i} />)}
{Array.from({ length: n }, (_, i) => i + 1).map((d) => {
const k = iso(d), on = k === selDate, has = tasks.some((t) => t.date === k && !off[t.cat]);
return (
<button key={d} onClick={() => { setSelDate(k); setCal(null); }} className="h-10 rounded-xl flex flex-col items-center justify-center text-sm tabular-nums" style={{ background: on ? C.blue : "transparent", color: on ? "#fff" : k === TODAY_STR ? C.blue : C.t1, border: k === TODAY_STR && !on ? "1px solid " + C.blue : "1px solid transparent" }}>
{d}<span className="w-1 h-1 rounded-full" style={{ background: has ? (on ? "#fff" : C.em) : "transparent" }} />
</button>
);
})}
</div>
<button onClick={() => { setSelDate(TODAY_STR); setCal(null); }} className="w-full rounded-xl py-3 text-sm font-semibold" style={{ background: C.card, color: C.blue }}>Go to today</button>
</Sheet>
);
})()}
{secs && (
<Sheet title="Show / hide sections" onClose={() => setSecs(false)}>
<p className="text-xs" style={{ color: C.t2 }}>Untick a section to hide its tasks, cards and medication schedule everywhere. Tick it again to bring them back.</p>
{secCats.map(([c, n]) => (
<button key={c} onClick={() => setOff({ ...off, [c]: !off[c] })} className="w-full flex items-center gap-3 rounded-xl px-3 py-2.5" style={{ background: C.card }}>
<span className="w-5 h-5 rounded-md border flex items-center justify-center" style={{ borderColor: off[c] ? C.t3 : C.blue, background: off[c] ? "transparent" : C.blue }}>{!off[c] && <Check size={14} color="#fff" />}</span>
<span className="flex-1 text-left text-sm" style={{ color: off[c] ? C.t3 : C.t1 }}>{c}</span>
<span className="text-xs" style={{ color: C.t2 }}>{n}</span>
</button>
))}
</Sheet>
)}
{ed && (
<Sheet title={(ed.mode === "edit" ? "Edit " : "Reschedule ") + ed.item.id} onClose={() => setEd(null)}>
{ed.mode === "edit" && <>
<input maxLength={LIM.title} value={ed.title} onChange={(e) => setEd({ ...ed, title: e.target.value })} placeholder="Title" className="w-full rounded-xl px-3 py-2.5 text-sm outline-none" style={{ background: C.card, color: C.t1 }} />
<Err m={edErrs.title} />
<input maxLength={LIM.notes} value={ed.notes} onChange={(e) => setEd({ ...ed, notes: e.target.value })} placeholder="Notes" className="w-full rounded-xl px-3 py-2.5 text-sm outline-none" style={{ background: C.card, color: C.t1 }} />
<Err m={edErrs.notes} />
<div className="flex flex-wrap gap-1.5">{CATS.map((c) => <Chip key={c} on={ed.cat === c} onClick={() => setEd({ ...ed, cat: c })}>{c}</Chip>)}</div>
<div className="flex gap-2">{["Low", "Medium", "High"].map((p) => <button key={p} onClick={() => setEd({ ...ed, pri: p })} className="flex-1 rounded-xl py-2 text-xs font-semibold" style={{ background: ed.pri === p ? (p === "High" ? C.red : p === "Medium" ? C.am : C.em) : C.card, color: ed.pri === p ? "#fff" : C.t2 }}>{p}</button>)}</div>
</>}
{ed.mode === "resched" && <p className="text-sm">{ed.title}</p>}
<div className="flex gap-2"><Chip on={ed.sched} onClick={() => setEd({ ...ed, sched: true })}>Scheduled</Chip><Chip on={!ed.sched} onClick={() => setEd({ ...ed, sched: false })}>Backlog</Chip></div>
{ed.sched && <div className="flex gap-2 items-center">
<input type="date" value={ed.date} onChange={(e) => setEd({ ...ed, date: e.target.value || TODAY_STR })} className="flex-1 min-w-0 rounded-xl px-3 py-2.5 text-sm outline-none" style={{ background: C.card, color: C.t1, colorScheme: "dark" }} />
<select value={ed.hh} onChange={(e) => setEd({ ...ed, hh: e.target.value })} className="rounded-xl px-2 py-2.5 text-sm outline-none" style={{ background: C.card, color: C.t1 }}>{Array.from({ length: 24 }, (_, i) => String(i).padStart(2, "0")).map((v) => <option key={v}>{v}</option>)}</select>
<span style={{ color: C.t2 }}>:</span>
<select value={ed.mm} onChange={(e) => setEd({ ...ed, mm: e.target.value })} className="rounded-xl px-2 py-2.5 text-sm outline-none" style={{ background: C.card, color: C.t1 }}>{Array.from({ length: 12 }, (_, i) => String(i * 5).padStart(2, "0")).map((v) => <option key={v}>{v}</option>)}</select>
</div>}
<Err m={edErrs.date} /><Err m={edErrs.time} />
<button disabled={Object.keys(edErrs).length > 0} onClick={saveEdit} className="w-full rounded-xl py-3 text-sm font-semibold disabled:opacity-40" style={{ background: C.blue }}>Save changes</button>
</Sheet>
)}
{scan && (
<Sheet title="Scan document" onClose={() => setScan(null)}>
{scan.stage === "pick" && <>
<p className="text-xs" style={{ color: C.t2 }}>Take a photo or upload a receipt, bill, prescription or doctor's note.</p>
<div className="flex gap-2">{[["auto", "Auto-detect"], ["receipt", "Receipt"], ["rx", "Prescription"]].map(([k, l]) => <Chip key={k} on={scan.mode === k} onClick={() => setScan({ ...scan, mode: k })}>{l}</Chip>)}</div>
<div className="grid grid-cols-2 gap-2">
<label className="rounded-xl py-3 text-sm font-semibold text-center cursor-pointer" style={{ background: C.blue }}><input type="file" accept="image/*" capture="environment" hidden onChange={onFile} />Take photo</label>
<label className="rounded-xl py-3 text-sm font-semibold text-center cursor-pointer" style={{ background: C.card }}><input type="file" accept="image/*" hidden onChange={onFile} />Upload image</label>
</div>
</>}
{scan.stage === "busy" && <div className="space-y-2 py-4"><p className="text-sm text-center" style={{ color: C.t2 }}>Reading text… {scan.progress}%</p><Bar pct={scan.progress} color={C.blue} /></div>}
{scan.stage === "error" && <>
<p className="text-sm" style={{ color: C.red }}>{scan.err}</p>
<button onClick={() => setScan({ stage: "pick", mode: scan.mode })} className="w-full rounded-xl py-3 text-sm font-semibold" style={{ background: C.card }}>Try again</button>
</>}
{scan.stage === "done" && <>
<div className="flex gap-3"><img src={scan.img} alt="" className="w-16 h-16 rounded-xl object-cover shrink-0" /><div className="min-w-0"><span className="text-[10px] font-semibold" style={{ color: C.am }}>{CODES[scan.res.code]} · {CODE_NAMES[scan.res.code]}</span><p className="text-sm font-semibold">{scan.res.title}</p><p className="text-xs" style={{ color: C.t2 }}>{scan.res.summary}</p></div></div>
{scan.text && <pre className="text-[11px] whitespace-pre-wrap max-h-32 overflow-y-auto p-2 rounded-lg" style={{ background: C.card, color: C.t2 }}>{scan.text}</pre>}
<div className="flex gap-2">
<button onClick={() => setScan({ stage: "pick", mode: scan.mode })} className="flex-1 rounded-xl py-3 text-sm font-semibold" style={{ background: C.card }}>Rescan</button>
<button onClick={saveScan} className="flex-1 rounded-xl py-3 text-sm font-semibold" style={{ background: C.blue }}>Save to backlog</button>
</div>
</>}
</Sheet>
)}
{consult && (
<Sheet title={`${consult.name}: doctor consultation`} onClose={() => setConsult(null)}>
<p className="text-sm" style={{ color: C.t2 }}>Is a follow-up appointment needed?</p>
<div className="flex gap-2">{[["Yes", true], ["No", false]].map(([l, v]) => <button key={l} onClick={() => setCForm({ ...cForm, follow: v })} className="flex-1 rounded-xl py-2.5 text-sm font-semibold" style={{ background: cForm.follow === v ? C.blue : C.card }}>{l}</button>)}</div>
{consult.fasting && <textarea value={cForm.note} onChange={(e) => setCForm({ ...cForm, note: e.target.value })} rows={3} placeholder="Fasting lab note (optional)" className="w-full rounded-xl p-3 text-sm outline-none" style={{ background: C.card, color: C.t1 }} />}
<button disabled={cForm.follow === null} onClick={() => { setConsultState((s) => ({ ...s, [consult.id]: cForm })); setConsult(null); }} className="w-full rounded-xl py-3 text-sm font-semibold disabled:opacity-40" style={{ background: C.blue }}>Save consultation</button>
</Sheet>
)}
{manual && (
<Sheet title="New task" onClose={() => setManual(false)}>
<div className="flex gap-2"><Chip on={mMode === "form"} onClick={() => setMMode("form")}>Form</Chip><Chip on={mMode === "cmd"} onClick={() => setMMode("cmd")}>Quick command</Chip></div>
{mMode === "cmd" && <>
<input autoFocus value={cli} onChange={(e) => setCli(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter" && runCli()) setManual(false); }} placeholder="=PT Call bank, 2026-10-01 10:00, High Priority" className="w-full rounded-xl px-3 py-2.5 text-sm outline-none font-mono" style={{ background: "#050608", color: C.em }} />
<div className="flex flex-wrap gap-1.5">{Object.keys(CODES).map((k) => <button key={k} onClick={() => setCli("=" + k + " ")} className="rounded-lg px-2.5 py-1.5 text-xs font-mono font-semibold" style={{ background: C.card, color: C.blue }}>={k}</button>)}</div>
{preview ? (
<Card className="space-y-1 text-xs">
<div className="flex justify-between"><span style={{ color: C.t2 }}>ID</span><span className="font-mono font-semibold" style={{ color: C.blue }}>{preview.id}</span></div>
<div className="flex justify-between"><span style={{ color: C.t2 }}>Category</span><span>{preview.cat}</span></div>
<div className="flex justify-between gap-4"><span style={{ color: C.t2 }}>Title</span><span className="text-right">{preview.title || "—"}</span></div>
{(preview.date || preview.time || preview.pr) && <div className="flex gap-2 flex-wrap pt-1">{(preview.date || preview.time) && <span className="px-2 py-0.5 rounded-full" style={{ background: "#0084FF22", color: C.blue }}>{[preview.date, preview.time].filter(Boolean).join(" ")}</span>}{preview.pr && <span className="px-2 py-0.5 rounded-full" style={{ background: "#F59E0B22", color: C.am }}>{preview.pr} priority</span>}</div>}
</Card>
) : <p className="text-xs" style={{ color: C.t3 }}>Start with a shortcode like =PT, or type plain text to save it to the backlog.</p>}
{Object.values(cliErrs).map((e) => <Err key={e} m={e} />)}
<button disabled={!cli.trim()} onClick={() => { if (runCli()) setManual(false); }} className="w-full rounded-xl py-3 text-sm font-semibold disabled:opacity-40" style={{ background: C.blue }}>Add</button>
</>}
{mMode === "form" && <>
<div className="grid grid-cols-5 gap-1.5">{Object.keys(CODES).map((k) => <button key={k} onClick={() => setMCode(k)} className="rounded-lg py-2 text-xs font-mono font-semibold" style={{ background: mCode === k ? C.blue : C.card }}>{k}</button>)}</div>
<p className="text-xs" style={{ color: C.t2 }}>{CODE_NAMES[mCode]} · {CODES[mCode]}</p>
<input maxLength={LIM.title} value={mTitle} onChange={(e) => setMTitle(e.target.value)} placeholder="Task title (max 30)" className="w-full rounded-xl px-3 py-2.5 text-sm outline-none" style={{ background: C.card, color: C.t1 }} />
<div className="flex justify-between gap-2"><Err m={mErrs.title} /><span className="text-[11px] ml-auto shrink-0" style={{ color: mTitle.length >= LIM.title ? C.am : C.t3 }}>{mTitle.length}/{LIM.title}</span></div>
<input maxLength={LIM.notes} value={mNotes} onChange={(e) => setMNotes(e.target.value)} placeholder="Notes (optional, max 90)" className="w-full rounded-xl px-3 py-2.5 text-sm outline-none" style={{ background: C.card, color: C.t1 }} />
<div className="flex justify-between gap-2"><Err m={mErrs.notes} /><span className="text-[11px] ml-auto shrink-0" style={{ color: mNotes.length >= LIM.notes ? C.am : C.t3 }}>{mNotes.length}/{LIM.notes}</span></div>
<div className="flex gap-2">
<Chip on={mSched} onClick={() => setMSched(true)}>Schedule</Chip>
<Chip on={!mSched} onClick={() => setMSched(false)}>Backlog</Chip>
<Chip on={mKeys} onClick={() => setMKeys(!mKeys)}>Quantity</Chip>
</div>
<div className="flex gap-2 items-center">
<input type="date" min={todayNow} value={mDate} onChange={(e) => setMDate(e.target.value || todayNow)} className="flex-1 min-w-0 rounded-xl px-3 py-2.5 text-sm outline-none" style={{ background: C.card, color: C.t1, colorScheme: "dark" }} />
{mSched && <>
<select value={mHH} onChange={(e) => setMHH(e.target.value)} className="rounded-xl px-2 py-2.5 text-sm outline-none" style={{ background: C.card, color: C.t1 }}>{Array.from({ length: 24 }, (_, i) => p2(i)).map((v) => <option key={v} disabled={mDate === todayNow && +v < nowD.getHours()}>{v}</option>)}</select>
<span style={{ color: C.t2 }}>:</span>
<select value={mMM} onChange={(e) => setMMM(e.target.value)} className="rounded-xl px-2 py-2.5 text-sm outline-none" style={{ background: C.card, color: C.t1 }}>{Array.from({ length: 60 }, (_, i) => p2(i)).map((v) => <option key={v} disabled={mDate === todayNow && +mHH === nowD.getHours() && +v < nowD.getMinutes()}>{v}</option>)}</select>
</>}
</div>
<Err m={mErrs.date} /><Err m={mErrs.time} />
<div className="flex gap-2">{["Low", "Medium", "High"].map((p) => <button key={p} onClick={() => setMPri(p)} className="flex-1 rounded-xl py-2 text-xs font-semibold" style={{ background: mPri === p ? (p === "High" ? C.red : p === "Medium" ? C.am : C.em) : C.card, color: mPri === p ? "#fff" : C.t2 }}>{p}</button>)}</div>
{mKeys && <>
<div className="rounded-xl px-3 py-2 text-right text-xl font-semibold tabular-nums" style={{ background: C.card, color: mNum ? C.t1 : C.t3 }}>{mNum || "0"}</div>
<Err m={mErrs.qty} />
<div className="grid grid-cols-3 gap-2">{["1", "2", "3", "4", "5", "6", "7", "8", "9", "C", "0", "⌫"].map((k) => <button key={k} onClick={() => press(k)} className="rounded-xl py-3 text-base font-semibold flex items-center justify-center" style={{ background: C.card, color: k === "C" ? C.red : C.t1 }}>{k === "⌫" ? <Delete size={18} /> : k}</button>)}</div>
</>}
<button disabled={mBlocked} onClick={confirmManual} className="w-full rounded-xl py-3 text-sm font-semibold disabled:opacity-40" style={{ background: C.blue }}>{mSched ? "Schedule at " + mHH + ":" + mMM : "Save to backlog"}</button>
</>}
</Sheet>
)}
{toast && <div className="absolute left-4 right-4 z-40 rounded-xl px-3 py-2 text-sm text-center" style={{ background: C.em, color: "#fff", bottom: "calc(var(--nh) + var(--sab) + 12px)" }}>{toast}</div>}
</div>
</div>
);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
